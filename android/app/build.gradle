plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wicketdynasty.cricketmanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.wicketdynasty.cricketmanager"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'

    // Unity LevelPlay Mediation SDK + Unity Ads Adapter (Rewarded & Interstitial only; zero Banners)
    implementation 'com.unity3d.ads-mediation:mediation-sdk:8.7.0'
    implementation 'com.unity3d.ads-mediation:unityads-adapter:4.3.51'
    implementation 'com.unity3d.ads:unity-ads:4.13.1'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
}
